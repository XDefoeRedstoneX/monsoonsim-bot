[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monsoonsim-bot"
version = "2.0.0"
description = "Desktop automation bot for the MonsoonSim business simulation, built on Playwright."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
monsoonsim-bot = "monsoon_bot.app:main"

[tool.setuptools]
packages = ["monsoon_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
